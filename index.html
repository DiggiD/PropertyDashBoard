<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Property Expense Dashboard</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"
        />
        <link rel="stylesheet" href="style.css" />
        <style> [data-theme="dark"] { background: #333; color: #fff; } #theme-toggle { cursor:pointer; padding:8px; } </style>

    </head>
    <body>
        <div class="app-container">
            <!-- Enhanced header with better accessibility -->
            <header class="header" role="banner">
                <div class="header-left">
                    <h1>RE.Dash</h1>
                </div>

                <!-- Year/Month Picker - Visible on overview and properties dashboards -->
                <div class="year-picker" id="yearPicker" style="display: none">
                    <div class="year-picker-header" id="yearPickerHeader">
                        <!-- Year options will be populated dynamically -->
                    </div>
                    <div class="month-picker" id="monthPicker" style="display: none">
                        <div class="month-picker-header" id="monthPickerHeader">
                            <!-- Month options will be populated dynamically -->
                        </div>
                    </div>
                </div>

                <nav class="header-actions" role="navigation" aria-label="Main actions">
                    <div class="dropdown" id="colorThemeDropdown">
                        <button
                            class="btn btn--outline btn--sm dropdown-btn"
                            id="colorThemeBtn"
                            aria-label="Select color theme"
                            aria-haspopup="true"
                            aria-expanded="false"
                        >
                            🎨 Theme
                        </button>
                        <div class="dropdown-menu" id="colorThemeMenu" role="menu" aria-hidden="true">
                            <!-- Options will be populated dynamically by JavaScript -->
                        </div>
                    </div>

                    <button class="btn btn--outline btn--sm" id="undoBtn" aria-label="Undo last action" disabled>
                        Undo
                    </button>
                    <button class="btn btn--outline btn--sm" id="redoBtn" aria-label="Redo last undone action" disabled>
                        Redo
                    </button>
                    <button
                        class="btn btn--outline btn--sm"
                        id="darkModeToggle"
                        aria-label="Toggle dark mode"
                        title="Toggle dark mode (for testing only)"
                    >
                        Dark
                    </button>

                    <button
                        class="btn btn--outline btn--sm"
                        id="historyBtn"
                        aria-label="Manage data history and snapshots"
                    >
                        History
                    </button>
                </nav>
            </header>

            <!-- Enhanced main content with proper roles and sidebar support -->
            <main class="main-content" role="main" aria-label="Expense visualization chart">
                <!-- New Smooth Sidebar -->
                <nav class="sidebar-nav" id="sidebarNav">
                    <!-- Overview Item -->
                    <div class="nav-item" id="overviewBtn" data-metric="overview">
                        <div class="nav-icon">O</div>
                        <div class="nav-text">
                            <span class="nav-label">Overview</span>
                        </div>
                    </div>

                    <!-- Properties Item -->
                    <div class="nav-item" id="propertiesBtn" data-metric="properties">
                        <div class="nav-icon">P</div>
                        <div class="nav-text">
                            <span class="nav-label">Properties</span>
                        </div>
                    </div>
                </nav>

                <!-- Dashboard Containers Section -->
                <div class="dashboard-containers">
                    <!-- Properties Dashboard Container -->
                    <div id="propertiesDashboard" class="dashboard-container dashboard-properties hidden">
                        <div class="dashboard-content">
                            <!-- Properties dashboard content will be dynamically inserted here -->
                        </div>
                    </div>

                    <!-- Overview Dashboard Container -->
                    <div id="overviewDashboard" class="dashboard-container dashboard-overview hidden">
                        <!-- Overview Chart Container - Ready for beautiful sankey diagram -->
                        <div
                            id="overviewChart"
                            class="overview-container"
                            role="img"
                            aria-label="Overview sankey visualization chart"
                        >
                            <div class="loading-state" id="overviewLoadingState">
                                <div class="loading-spinner"></div>
                                <p>Loading overview chart...</p>
                            </div>
                            <div id="overviewChartContent" class="chart-content"></div>
                        </div>
                    </div>
                </div>
                <!-- Close dashboard-containers -->
            </main>

            <!-- Enhanced detail panel with accessibility -->
            <div
                id="detailPanel"
                class="detail-panel"
                role="complementary"
                aria-label="Detailed information panel"
                aria-hidden="true"
            >
                <div class="detail-header">
                    <h3 id="detailTitle">Details</h3>
                    <button class="detail-close" id="closeDetailPanel" aria-label="Close details panel">&times;</button>
                </div>
                <div class="detail-content" id="detailContent" role="region" aria-labelledby="detailTitle">
                    <!-- Dynamic content will be inserted here -->
                </div>
            </div>

            <!-- Enhanced overlay -->
            <div id="panelOverlay" class="panel-overlay" aria-hidden="true"></div>
        </div>

        <!-- Add this import modal after the Add Category Modal (around line 191) -->
        <div id="importModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Import Data</h3>
                    <button class="modal-close" id="closeImportModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label" for="importData">Paste JSON data to import</label>
                        <textarea
                            id="importData"
                            class="form-control"
                            rows="10"
                            placeholder="Paste exported JSON data here..."
                        ></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn--outline" id="cancelImport">Cancel</button>
                    <button class="btn btn--primary" id="confirmImport">Import Data</button>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">
            <span id="toastMessage"></span>
        </div>

        <div id="chart-container" style="width:100%;height:600px;"></div>
        <div id="error-placeholder" style="display:none; padding:20px; text-align:center; color:#dc3545; background:#f8d7da; border:1px solid #f5c6cb; border-radius:4px; margin:10px 0;"></div>
        <div id="tooltip" style="position:absolute;opacity:0;"></div>

        <!-- Load modules with ESM -->
        <script type="module" src="/src/index.js"></script>
    </body>
</html>
